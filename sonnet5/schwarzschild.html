<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schwarzschild Black Hole</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;width:100%;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab;}
  canvas:active{cursor:grabbing;}
  #ui{
    position:fixed;top:10px;left:10px;color:#cfe3ff;font:12px/1.5 -apple-system,Helvetica,Arial,sans-serif;
    background:rgba(10,14,24,0.45);padding:8px 12px;border-radius:8px;pointer-events:none;
    user-select:none;letter-spacing:0.2px;
  }
  #ui b{color:#fff;}
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="ui"><b>Schwarzschild Black Hole</b><br>drag to orbit &middot; scroll to zoom</div>
<script>
(function(){
"use strict";

const canvas = document.getElementById("glcanvas");
const gl = canvas.getContext("webgl2", {antialias:false, alpha:false, powerPreference:"high-performance"});
if(!gl){ document.body.innerHTML = "<div style='color:#fff;font-family:sans-serif;padding:40px'>WebGL2 is required.</div>"; }

const VERT_SRC = `#version 300 es
void main(){
  vec2 verts[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
  gl_Position = vec4(verts[gl_VertexID], 0.0, 1.0);
}`;

const FRAG_SRC = `#version 300 es
precision highp float;

uniform vec2  iResolution;
uniform vec3  uCamPos;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec3  uCamFwd;
uniform float uTanHalfFov;
uniform float uTime;
uniform float uDiskInner;
uniform float uDiskOuter;

out vec4 fragColor;

// ---------- hashing / noise ----------
float hash21(vec2 p){
  p = fract(p*vec2(123.34,456.21));
  p += dot(p, p+45.32);
  return fract(p.x*p.y);
}
float hash13(vec3 p){
  p = fract(p*0.1031);
  p += dot(p, p.yzx+33.33);
  return fract((p.x+p.y)*p.z);
}
float noise2(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  float a = hash21(i);
  float b = hash21(i+vec2(1.0,0.0));
  float c = hash21(i+vec2(0.0,1.0));
  float d = hash21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0, amp = 0.5;
  for(int i=0;i<5;i++){
    v += amp*noise2(p);
    p *= 2.02;
    amp *= 0.55;
  }
  return v;
}

// ---------- starfield (procedural sky) ----------
vec3 starfield(vec3 dir){
  vec3 col = vec3(0.006,0.007,0.012);
  // faint nebula band
  float band = pow(max(0.0, 1.0-abs(dir.y)*1.4), 3.0);
  col += band*vec3(0.05,0.045,0.09)*(0.5+0.5*fbm(dir.xz*2.5+dir.y*3.0));

  for(int layer=0; layer<3; layer++){
    float scale = 220.0 + float(layer)*140.0;
    vec3 gp = dir*scale;
    vec3 cell = floor(gp);
    float n = hash13(cell + float(layer)*17.0);
    if(n > 0.9835){
      float b = fract(n*57.0);
      vec3 starColor = mix(vec3(1.0,0.85,0.65), vec3(0.75,0.85,1.0), fract(n*13.0));
      float bright = smoothstep(0.9835,1.0,n)*b;
      col += starColor*bright*(1.4-float(layer)*0.28);
    }
  }
  return col;
}

// ---------- disk shading ----------
vec3 diskColor(vec3 p, float rad, float innerR, float outerR, out float alpha){
  float t = clamp((rad-innerR)/(outerR-innerR), 0.0, 1.0);
  vec3 hot  = vec3(1.6,1.25,0.95);
  vec3 cool = vec3(0.95,0.28,0.06);
  vec3 base = mix(hot, cool, pow(t,0.65));

  float phi = atan(p.z, p.x);
  float rot = uTime*(1.1/pow(rad*0.35+0.6,1.5));
  float turb = fbm(vec2(phi*2.4 + rot, rad*0.55 - uTime*0.05));
  turb = 0.55 + 0.9*turb;

  float edge = smoothstep(innerR, innerR*1.35, rad);
  float fall = pow(innerR/max(rad,0.001), 1.6);
  float intensity = edge*fall*2.6;

  float grav = sqrt(clamp(1.0-1.0/max(rad,1.001), 0.05, 1.0));
  base *= mix(vec3(0.6,0.65,1.0), vec3(1.0), grav);

  vec3 col = base*intensity*turb;
  alpha = clamp(0.25 + 1.15*edge*fall, 0.12, 0.92);
  return col;
}

// ---------- geodesic integration ----------
// units: Schwarzschild radius r_s = 1 (event horizon at r=1)
vec3 accel(vec3 p, float h2){
  float r2 = dot(p,p);
  float r5 = r2*r2*sqrt(r2);
  return -1.5*h2*p/r5;
}

vec3 traceRay(vec3 ro, vec3 rd){
  vec3 p = ro;
  vec3 v = rd;
  float h2 = dot(cross(p,rd), cross(p,rd));

  vec3 accum = vec3(0.0);
  float alphaAcc = 0.0;

  const int MAX_STEPS = 260;
  const float R_ESCAPE = 60.0;
  const float R_HORIZON = 1.0;

  for(int i=0;i<MAX_STEPS;i++){
    float r = length(p);
    if(r > R_ESCAPE) break;
    if(r < R_HORIZON*1.001){
      accum += (1.0-alphaAcc)*vec3(0.0);
      alphaAcc = 1.0;
      break;
    }

    float dt = 0.09*clamp((r-0.9)*0.55, 0.05, 2.2);

    vec3 pPrev = p;

    // RK4
    vec3 k1p = v,             k1v = accel(p, h2);
    vec3 k2p = v+0.5*dt*k1v,  k2v = accel(p+0.5*dt*k1p, h2);
    vec3 k3p = v+0.5*dt*k2v,  k3v = accel(p+0.5*dt*k2p, h2);
    vec3 k4p = v+dt*k3v,      k4v = accel(p+dt*k3p, h2);

    p += (dt/6.0)*(k1p+2.0*k2p+2.0*k3p+k4p);
    v += (dt/6.0)*(k1v+2.0*k2v+2.0*k3v+k4v);

    if(alphaAcc < 0.995 && sign(pPrev.y) != sign(p.y)){
      float denom = (pPrev.y - p.y);
      float tcross = abs(denom) > 1e-8 ? (pPrev.y/denom) : 0.5;
      vec3 hitP = mix(pPrev, p, clamp(tcross,0.0,1.0));
      float rad = length(hitP.xz);
      if(rad > uDiskInner && rad < uDiskOuter){
        float a;
        vec3 c = diskColor(hitP, rad, uDiskInner, uDiskOuter, a);
        accum += (1.0-alphaAcc)*a*c;
        alphaAcc += (1.0-alphaAcc)*a;
      }
    }
  }

  if(alphaAcc < 0.995){
    vec3 bg = starfield(normalize(v));
    accum += (1.0-alphaAcc)*bg;
  }
  return accum;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*iResolution) / iResolution.y;
  vec3 rd = normalize(uCamFwd + (uv.x*uTanHalfFov)*uCamRight + (uv.y*uTanHalfFov)*uCamUp);
  vec3 col = traceRay(uCamPos, rd);

  col *= 1.35;
  col = col/(1.0+col);          // simple tonemap
  float lum = dot(col, vec3(0.299,0.587,0.114));
  col = mix(vec3(lum), col, 1.35); // saturation boost
  col = pow(max(col,0.0), vec3(0.4545)); // gamma
  fragColor = vec4(col, 1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
    throw new Error("shader compile failed");
  }
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT_SRC));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG_SRC));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
  console.error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const U = {};
["iResolution","uCamPos","uCamRight","uCamUp","uCamFwd","uTanHalfFov","uTime","uDiskInner","uDiskOuter"]
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

// ---------- orbit camera ----------
const state = {
  theta: 1.35,     // polar angle from spin axis (y)
  phi: 0.9,        // azimuth
  radius: 14.0,
  dragging: false,
  lastX: 0, lastY: 0
};
const RMIN = 3.6, RMAX = 45.0;
const THMIN = 0.12, THMAX = Math.PI-0.12;

canvas.addEventListener("pointerdown", e=>{
  state.dragging = true; state.lastX = e.clientX; state.lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e=>{
  if(!state.dragging) return;
  const dx = e.clientX - state.lastX, dy = e.clientY - state.lastY;
  state.lastX = e.clientX; state.lastY = e.clientY;
  state.phi   -= dx*0.0055;
  state.theta -= dy*0.0055;
  state.theta = Math.min(THMAX, Math.max(THMIN, state.theta));
});
window.addEventListener("pointerup", ()=>{ state.dragging = false; });
canvas.addEventListener("pointercancel", ()=>{ state.dragging = false; });
canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  state.radius *= Math.exp(e.deltaY*0.0011);
  state.radius = Math.min(RMAX, Math.max(RMIN, state.radius));
}, {passive:false});

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 1.5);
  const w = Math.max(1, Math.floor(window.innerWidth*dpr));
  const h = Math.max(1, Math.floor(window.innerHeight*dpr));
  if(canvas.width!==w || canvas.height!==h){
    canvas.width = w; canvas.height = h;
    gl.viewport(0,0,w,h);
  }
}
window.addEventListener("resize", resize);
resize();

const t0 = performance.now();
function frame(){
  resize();

  const st = state.theta, ph = state.phi, r = state.radius;
  const camPos = [
    r*Math.sin(st)*Math.cos(ph),
    r*Math.cos(st),
    r*Math.sin(st)*Math.sin(ph)
  ];
  const len = Math.hypot(camPos[0],camPos[1],camPos[2]);
  const fwd = [-camPos[0]/len, -camPos[1]/len, -camPos[2]/len];
  const worldUp = [0,1,0];
  let rx = fwd[1]*worldUp[2]-fwd[2]*worldUp[1];
  let ry = fwd[2]*worldUp[0]-fwd[0]*worldUp[2];
  let rz = fwd[0]*worldUp[1]-fwd[1]*worldUp[0];
  const rl = Math.hypot(rx,ry,rz) || 1.0;
  rx/=rl; ry/=rl; rz/=rl;
  const upx = ry*fwd[2]-rz*fwd[1];
  const upy = rz*fwd[0]-rx*fwd[2];
  const upz = rx*fwd[1]-ry*fwd[0];

  gl.uniform2f(U.iResolution, canvas.width, canvas.height);
  gl.uniform3f(U.uCamPos, camPos[0], camPos[1], camPos[2]);
  gl.uniform3f(U.uCamRight, rx, ry, rz);
  gl.uniform3f(U.uCamUp, upx, upy, upz);
  gl.uniform3f(U.uCamFwd, fwd[0], fwd[1], fwd[2]);
  gl.uniform1f(U.uTanHalfFov, Math.tan(0.5*50.0*Math.PI/180.0));
  gl.uniform1f(U.uTime, (performance.now()-t0)/1000.0);
  gl.uniform1f(U.uDiskInner, 3.0);
  gl.uniform1f(U.uDiskOuter, 16.0);

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
