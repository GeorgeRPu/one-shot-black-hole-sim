<style>
  :root {
    --bg: #09090b;
    --surface: #111113;
    --surface-2: #18181b;
    --surface-3: #1e1e22;
    --border: rgba(255, 255, 255, 0.06);
    --border-hover: rgba(255, 255, 255, 0.12);
    --border-active: rgba(255, 255, 255, 0.18);
    --text: #fafafa;
    --text-secondary: #a1a1aa;
    --text-tertiary: #71717a;
    --accent: #a78bfa;

    --gradient-brand: linear-gradient(135deg, #a78bfa, #818cf8, #6366f1);

  html, body {

    -moz-osx-font-smoothing: grayscale;

  body {
    display: flex;
    flex-direction: column;

  /* ---------- Nav ---------- */
  nav {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    height: 56px;
    background: rgba(9, 9, 11, 0.8);
    backdrop-filter: blur(16px) saturate(1.6);
    -webkit-backdrop-filter: blur(16px) saturate(1.6);
    border-bottom: 1px solid var(--border);
    z-index: 50;
  }
  .nav-brand {
    display: flex;
    align-items: center;

  .nav-logo {

                conic-gradient(from 120deg, #ffb45e, #ff7a3c, #a78bfa, #6366f1, #ffb45e);
    box-shadow: 0 0 18px rgba(167, 139, 250, 0.3);
    flex-shrink: 0;
  }
  .nav-title {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
    margin: 0;
    line-height: inherit;
  }
  .nav-divider {
    width: 1px;
    height: 20px;
    background: var(--border);
    flex-shrink: 0;
  }
  .nav-subtitle {
    font-size: 0.82rem;
    color: var(--text-tertiary);
    white-space: nowrap;
  }

  .prompt-term {
    position: relative;
    color: var(--text-secondary);
    border-bottom: 1px dotted var(--text-tertiary);

  .prompt-term:hover, .prompt-term:focus-visible {

  }
  .prompt-pop {

    position: absolute;
    left: 0;
    top: 100%;

    cursor: auto;
  }
  .prompt-term:hover .prompt-pop,
  .prompt-term:focus .prompt-pop { display: block; }
  .prompt-pop-inner {
    display: block;
    max-height: 62vh;
    overflow-y: auto;
    background: var(--surface-2);
    border: 1px solid var(--border-hover);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255,255,255,0.04);

  /* ---------- Skip link ---------- */

  /* ---------- Reduced motion ---------- */

<script>
"use strict";

const MODELS = [
  { id: "opus4.6", label: "Claude Opus 4.6" },
  { id: "opus4.8", label: "Claude Opus 4.8" },
  { id: "sonnet5", label: "Claude Sonnet 5" },
  { id: "fable5",  label: "Claude Fable 5" },
];
const SIM_NAMES = { schwarzschild: "Schwarzschild", kerr: "Kerr" };

const PROMPTS = {
  schwarzschild: `## Schwarzschild Black Hole Simulator

Build a real-time, interactive 3D black hole simulator as a single
self-contained HTML file (vanilla JavaScript + WebGL, no libraries, no
build step, no external assets).

Requirements:
- Trace light rays so the starfield background is gravitationally lensed
  and the glowing accretion disk wraps over and under the black hole's
  shadow.
- Click-drag to orbit the camera, scroll to zoom.
- Keep it smooth (~60fps) in a browser; prioritize physical correctness.

Return only the complete HTML file.`,
  kerr: `## Kerr Black Hole Simulator

Build a real-time, interactive 3D simulator of a SPINNING (Kerr) black
hole as a single self-contained HTML file (vanilla JavaScript + WebGL, no
libraries, no build step, no external assets).

Requirements:
- Trace light rays through curved spacetime so the starfield background is
  gravitationally lensed and the glowing accretion disk wraps over and
  under the black hole's shadow.
- Model black-hole spin with frame-dragging, and expose a control to vary
  the spin from 0 (non-rotating) up to near-maximal. The shadow should
  become asymmetric and the inner disk edge should move as spin changes.
- Include relativistic effects on the disk: Doppler beaming (one side
  noticeably brighter) and gravitational redshift.
- Click-drag to orbit the camera, scroll to zoom.
- Keep it smooth (~60fps) in a browser; prioritize physical correctness.

Return only the complete HTML file.`,
};

const PANE_COUNT = { single: 1, duel: 2, grid: 4 };

const state = {
  sim: "schwarzschild",
  layout: "duel",
  slots: MODELS.map(m => m.id),
  loaded: [false, false, false, false],
};

(function restore() {
  const parts = location.hash.replace(/^#/, "").split("/").filter(Boolean);
  if (SIM_NAMES[parts[0]]) state.sim = parts[0];
  if (PANE_COUNT[parts[1]]) state.layout = parts[1];
  if (parts[2]) {
    const ids = parts[2].split(",").filter(id => MODELS.some(m => m.id === id));
    ids.forEach((id, i) => { if (i < 4) state.slots[i] = id; });
  }
})();

const stage = document.getElementById("stage");

function srcFor(modelId) {
  return `${modelId}/${state.sim}.html`;
}

function syncHash() {
  const n = PANE_COUNT[state.layout];
  location.replace(
    `#${state.sim}/${state.layout}/${state.slots.slice(0, n).join(",")}`
  );
}

function buildPane(i) {
  const pane = document.createElement("section");
  pane.className = "pane";

  const bar = document.createElement("div");
  bar.className = "pane-bar";

  const badge = document.createElement("span");
  badge.className = "model-badge";
  const dot = document.createElement("span");
  dot.className = "model-dot";
  dot.dataset.model = state.slots[i];
  const badgeLabel = document.createTextNode(MODELS.find(m => m.id === state.slots[i])?.label || "");
  badge.append(dot, badgeLabel);

  const select = document.createElement("select");
  select.setAttribute("aria-label", "Choose model for pane " + (i + 1));
  for (const m of MODELS) {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.label;
    if (m.id === state.slots[i]) opt.selected = true;
    select.appendChild(opt);
  }
  select.addEventListener("change", () => {
    state.slots[i] = select.value;
    syncHash();
    render();
  });

  const reload = document.createElement("button");
  reload.className = "icon-btn";
  reload.setAttribute("aria-label", "Restart simulation");
  reload.textContent = "↻";
  reload.addEventListener("click", () => {
    const frame = pane.querySelector("iframe");
    if (frame) frame.src = frame.src.split("?")[0] + "?r=" + Date.now();
  });

  const fs = document.createElement("button");
  fs.className = "icon-btn";
  fs.setAttribute("aria-label", "Fullscreen this pane");
  fs.textContent = "⛶";
  fs.addEventListener("click", () => {
    const body = pane.querySelector(".pane-body");
    if (document.fullscreenElement) document.exitFullscreen();
    else body.requestFullscreen?.();
  });

  const spacer = document.createElement("span");
  spacer.className = "spacer";

  bar.append(select, spacer, reload, fs);

  const body = document.createElement("div");
  body.className = "pane-body";

  if (state.loaded[i]) {
    const frame = document.createElement("iframe");
    frame.src = srcFor(state.slots[i]);
    frame.title = `${state.slots[i]} — ${SIM_NAMES[state.sim]}`;
    frame.loading = "lazy";
    body.appendChild(frame);
  } else {
    const ph = document.createElement("button");
    ph.className = "placeholder";
    ph.innerHTML = `
      <div class="orb-container">
        <div class="play-ring"></div>
        <div class="orb"></div>
      </div>
      <div class="cta">Load simulation <span class="cta-arrow">&rarr;</span></div>
      <div class="meta">real-time WebGL ray tracer</div>`;
    ph.addEventListener("click", () => {
      state.loaded[i] = true;
      render();
    });
    body.appendChild(ph);
  }

  pane.append(bar, body);
  return pane;
}

function render() {
  stage.dataset.layout = state.layout;
  stage.replaceChildren();
  const n = PANE_COUNT[state.layout];
  for (let i = 0; i < n; i++) stage.appendChild(buildPane(i));
  syncSegs();
}

function syncPrompt() {
  document.getElementById("promptPop").textContent = PROMPTS[state.sim];
}

function syncSegs() {
  syncPrompt();
  for (const b of document.querySelectorAll("#simSeg button"))
    b.setAttribute("aria-pressed", String(b.dataset.sim === state.sim));
  for (const b of document.querySelectorAll("#layoutSeg button"))
    b.setAttribute("aria-pressed", String(b.dataset.layout === state.layout));
}

document.getElementById("simSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-sim]");
  if (!b || b.dataset.sim === state.sim) return;
  state.sim = b.dataset.sim;
  syncHash();
  render();
});

document.getElementById("layoutSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-layout]");
  if (!b || b.dataset.layout === state.layout) return;
  state.layout = b.dataset.layout;
  const n = PANE_COUNT[state.layout];
  for (let i = n; i < 4; i++) state.loaded[i] = false;
  syncHash();
  render();
});

syncHash();
render();
</script>
</body>
</html>
